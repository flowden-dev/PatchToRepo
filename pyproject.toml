[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-to-repo"
version = "2.0.7"
description = "Review and apply Git patches with syntax-highlighted diffs, automatic repository matching, and Windows Explorer integration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Patch to Repo contributors"}]
dependencies = ["PySide6-Essentials==6.8.3", "Pygments==2.21.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "ruff==0.17.4", "build==1.6.1"]
packaging = ["pyinstaller==6.22.3"]

[project.gui-scripts]
patch-to-repo = "patchtorepo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchtorepo = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
