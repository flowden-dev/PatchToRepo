name: Feature request
description: Suggest a focused improvement to the patch workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain the workflow and how it should handle failure or cancellation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
